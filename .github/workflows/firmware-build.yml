name: Firmware build

on:
  push:
    paths:
      - "firmware"
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "firmware"
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "Build every release board upstream ships, instead of one per chip family"
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U platformio
      - id: list
        working-directory: firmware
        # Board names are never hardcoded here. Upstream Meshtastic already
        # maintains the authoritative list *and* its tiering (board_level unset
        # = release, "pr" = smoke-tested on every upstream PR, "extra" =
        # community boards upstream does not build and which are routinely
        # broken for reasons unrelated to this fork). generate_ci_matrix.py
        # resolves it through PlatformIO's own config parser, so `extends` is
        # honoured and renamed/added/removed boards track the submodule
        # automatically. A hand-maintained list here drifted out of sync on
        # every submodule bump and caused several red runs.
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            matrix=$(python3 bin/generate_ci_matrix.py all)
          else
            # One representative board per chip family, taken from upstream's
            # own PR tier so it is always a board upstream itself keeps green.
            # sort_by makes the pick deterministic rather than dependent on
            # ini-file ordering. Keeps the default push build to ~8 jobs while
            # still covering esp32/s3/c3/c6 + nrf52840 + rp2040/rp2350 + stm32.
            # The PR tier contains no ESP32-S2 board: the only S2 variant in the
            # tree is board_level=extra and fails upstream in the core's USB-CDC
            # header, nothing to do with this bridge.
            matrix=$(python3 bin/generate_ci_matrix.py all --level pr)
          fi
          echo "envs=$(echo "$matrix" | jq -c 'group_by(.platform) | map(sort_by(.board)[0].board)')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.discover.outputs.envs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U platformio
      - name: Build ${{ matrix.env }}
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}
      - name: Upload firmware binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/.pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: ignore
          retention-days: 30
