name: Firmware build (ESP32 boards)

on:
  push:
    paths:
      - "firmware"
      - "firmware/**"
      - "scripts/list_esp32_envs.py"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "firmware"
      - "firmware/**"
      - "scripts/list_esp32_envs.py"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "Build all ~126 ESP32 board targets instead of the smoke-test subset"
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: list
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            echo "envs=$(python3 scripts/list_esp32_envs.py firmware)" >> "$GITHUB_OUTPUT"
          else
            # Smoke-test subset: one representative board per ESP32 chip
            # family (esp32/esp32s3/esp32c3/esp32c6/esp32s2). Full 126-board
            # sweep is available via workflow_dispatch with full=true.
            echo 'envs=["heltec-v3","tbeam","heltec-ht62-esp32c3-sx1262","tlora_c6","nugget_s2_lora"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.discover.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U platformio
      - name: Build ${{ matrix.env }}
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}
