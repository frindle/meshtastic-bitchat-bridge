name: Firmware build

on:
  push:
    paths:
      - "firmware"
      - "firmware/**"
      - "scripts/list_esp32_envs.py"
      - ".github/workflows/firmware-build.yml"
  pull_request:
    paths:
      - "firmware"
      - "firmware/**"
      - "scripts/list_esp32_envs.py"
      - ".github/workflows/firmware-build.yml"
  workflow_dispatch:
    inputs:
      full:
        description: "Build all ~215 board targets (every chip family) instead of the smoke-test subset"
        type: boolean
        default: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: list
        run: |
          if [ "${{ github.event.inputs.full }}" = "true" ]; then
            echo "envs=$(python3 scripts/list_esp32_envs.py firmware --all-platforms)" >> "$GITHUB_OUTPUT"
          else
            # Smoke-test subset: one representative board per supported chip
            # family (esp32/esp32s3/esp32c3/esp32c6/esp32s2, plus nRF52840 and
            # RP2040/RP2350/STM32 stock-firmware coverage — our BitchatBridge
            # module itself is ESP32-only for now, but the rest of the fork
            # should still build cleanly on every platform Meshtastic supports).
            # Full ~215-board sweep is available via workflow_dispatch with full=true.
            echo 'envs=["heltec-v3","tbeam","heltec-ht62-esp32c3-sx1262","tlora_c6","nugget_s2_lora","rak4631","rp2040-lora","pico2","wio-e5"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJson(needs.discover.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U platformio
      - name: Build ${{ matrix.env }}
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}
      - name: Upload firmware binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/.pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: ignore
          retention-days: 30
